AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Snapspot WebSocket API for Real-Time Updates

Resources:
  # WebSocket API
  SnapspotWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: snapspot-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  # DynamoDB Table for Connection Storage
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: snapspot-websocket-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: jobId-index
          KeySchema:
            - AttributeName: jobId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Lambda: Handle WebSocket Connections
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: connect.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  # Lambda: Handle Disconnections
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: disconnect.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub 'https://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - 'execute-api:ManageConnections'
              Resource:
                - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SnapspotWebSocketApi}/*'

  # Lambda: Handle Join Job Action
  WebSocketJoinJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: joinJob.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub 'https://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - 'execute-api:ManageConnections'
              Resource:
                - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SnapspotWebSocketApi}/*'

  # Routes
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref ConnectIntegration

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      RouteKey: $disconnect
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref DisconnectIntegration

  JoinJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      RouteKey: joinJob
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref JoinJobIntegration

  # Integrations
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations

  JoinJobIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketJoinJobFunction.Arn}/invocations

  # Deployment
  Deployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - JoinJobRoute
    Properties:
      ApiId: !Ref SnapspotWebSocketApi

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: production
      DeploymentId: !Ref Deployment
      ApiId: !Ref SnapspotWebSocketApi
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 1000

  # Lambda Permissions
  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com

  JoinJobPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketJoinJobFunction
      Principal: apigateway.amazonaws.com

Parameters:
  CognitoRegion:
    Type: String
    Default: us-east-1
    Description: AWS region where Cognito User Pool is located
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_w26khZFQU
    Description: Cognito User Pool ID for JWT verification

Outputs:
  WebSocketURL:
    Description: WebSocket endpoint URL for client connections
    Value: !Sub wss://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name: !Sub ${AWS::StackName}-WebSocketURL

  WebSocketApiId:
    Description: WebSocket API ID
    Value: !Ref SnapspotWebSocketApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiId

  ConnectionsTableName:
    Description: DynamoDB table name for WebSocket connections
    Value: !Ref ConnectionsTable
    Export:
      Name: !Sub ${AWS::StackName}-ConnectionsTable

  WebSocketManagementEndpoint:
    Description: Endpoint for sending messages to WebSocket connections (for broadcaster)
    Value: !Sub https://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name: !Sub ${AWS::StackName}-ManagementEndpoint
