AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Snapspot WebSocket API for Real-Time Updates
Resources:
  SnapspotWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: snapspot-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: snapspot-websocket-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: connectionId
        AttributeType: S
      - AttributeName: jobId
        AttributeType: S
      KeySchema:
      - AttributeName: connectionId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: jobId-index
        KeySchema:
        - AttributeName: jobId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketConnectFunction
      Handler: connect.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
          COGNITO_REGION:
            Ref: CognitoRegion
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPoolId
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WebSocketConnectFunction
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketDisconnectFunction
      Handler: disconnect.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WebSocketDisconnectFunction
  WebSocketJoinJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketJoinJobFunction
      Handler: joinJob.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WebSocketJoinJobFunction
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: ConnectIntegration
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: DisconnectIntegration
  JoinJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      RouteKey: joinJob
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: JoinJobIntegration
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations
  JoinJobIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketJoinJobFunction.Arn}/invocations
  Deployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - ConnectRoute
    - DisconnectRoute
    - JoinJobRoute
    Properties:
      ApiId:
        Ref: SnapspotWebSocketApi
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: production
      DeploymentId:
        Ref: Deployment
      ApiId:
        Ref: SnapspotWebSocketApi
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 1000
  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
  JoinJobPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WebSocketJoinJobFunction
      Principal: apigateway.amazonaws.com
Parameters:
  CognitoRegion:
    Type: String
    Default: us-east-1
    Description: AWS region where Cognito User Pool is located
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_w26khZFQU
    Description: Cognito User Pool ID for JWT verification
Outputs:
  WebSocketURL:
    Description: WebSocket endpoint URL for client connections
    Value:
      Fn::Sub: wss://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-WebSocketURL
  WebSocketApiId:
    Description: WebSocket API ID
    Value:
      Ref: SnapspotWebSocketApi
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ApiId
  ConnectionsTableName:
    Description: DynamoDB table name for WebSocket connections
    Value:
      Ref: ConnectionsTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ConnectionsTable
  WebSocketManagementEndpoint:
    Description: Endpoint for sending messages to WebSocket connections (for broadcaster)
    Value:
      Fn::Sub: https://${SnapspotWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ManagementEndpoint
